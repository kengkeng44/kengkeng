# 每個 permission pattern 的中英文說明 + 合併 pair 規則
# Claude 跑 /refresh-dashboard 時讀這份產生 Permissions 區段的 cards

# 合併 pair — pair 內第一個是主 code, 第二個顯示為 alt-code
pairs:
  - primary: "Bash(ls)"
    alt: "Bash(ls *)"
    en: "List directory — bare or with arguments."
    zh: "列目錄,裸 / 帶參數兩種粒度。"
    search: "bash ls list 目錄 參數"
  - primary: "Bash(dir)"
    alt: "Bash(dir *)"
    en: "Windows-style dir — bare or with arguments."
    zh: "Windows 風格列表,裸 / 帶參數兩種粒度。"
    search: "bash dir windows 參數"
  - primary: "Bash(git status)"
    alt: "Bash(git status *)"
    en: "Show working tree status — bare or with flags."
    zh: "顯示 working tree 狀態,裸 / 帶 flag 兩種。"
    search: "git status working tree flag"
  - primary: "Bash(git diff)"
    alt: "Bash(git diff *)"
    en: "Show diff — bare or with arguments."
    zh: "顯示差異,裸 / 帶參數兩種。"
    search: "git diff 參數"
  - primary: "Bash(git log)"
    alt: "Bash(git log *)"
    en: "Show commit history — bare or with arguments."
    zh: "顯示 commit 歷史,裸 / 帶參數兩種。"
    search: "git log commit history 參數"
  - primary: "Bash(npm install)"
    alt: "Bash(npm install *)"
    en: "Install local node deps — bare or with package args."
    zh: "安裝本機 node 套件,裸 / 帶套件參數兩種。"
    search: "npm install node 套件 參數"
  - primary: "Bash(git push)"
    alt: "Bash(git push *)"
    en: "Push to remote — bare or with flags."
    zh: "推送到遠端,裸 / 帶 flag 兩種。"
    search: "git push 推送 遠端 flag"
  - primary: "Bash(git commit)"
    alt: "Bash(git commit *)"
    en: "Create a commit — bare or with args."
    zh: "建立 commit,裸 / 帶參數兩種。"
    search: "git commit 建立 參數"

# 獨立 patterns — pattern 是 settings.json 裡的字串, 顯示為單張 card
descriptions:
  "Read":
    en: "Read any file on disk."
    zh: "讀取磁碟上的任意檔案。"
    search: "read file 讀檔"
  "Bash(npm run *)":
    en: "Run package.json scripts."
    zh: "跑 package.json scripts。"
    search: "npm run scripts package.json"
  "Bash(python *)":
    en: "Run python with args."
    zh: "執行 python。"
    search: "python 執行"
  "Bash(python3 *)":
    en: "Run python3 with args."
    zh: "執行 python3。"
    search: "python3 執行"
  "Bash(py *)":
    en: "Windows Python launcher."
    zh: "Windows py launcher。"
    search: "py windows python launcher"
  "Bash(grep *)":
    en: "Search file content."
    zh: "搜尋檔案內容。"
    search: "grep 搜尋 內容"
  "Bash(find *)":
    en: "Find files on disk."
    zh: "搜尋磁碟檔案。"
